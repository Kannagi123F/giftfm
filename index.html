<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para María - Fantasy Romance</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
        }

        :root {
            --fantasy-blue: #38bdf8;
            --fantasy-glow: rgba(56, 189, 248, 0.4);
            --border-glow: rgba(147, 197, 253, 0.6);
            --panel-bg: rgba(3, 7, 18, 0.85);
        }

        body, html {
            width: 100vw;
            height: 100dvh;
            margin: 0;
            padding: 0;
            background: #020617;
            font-family: 'Noto Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .mobile-container {
            width: 92%;
            height: 94dvh;
            max-width: 400px;
            max-height: 800px;
            margin: auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 12px 12px 12px;
            position: relative;
            background-color: #030712;
            border: 2px solid var(--border-glow);
            border-radius: 24px;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.9), 
                0 0 25px var(--fantasy-glow),
                inset 0 0 20px rgba(56, 189, 248, 0.2);
            overflow: hidden;
            z-index: 10;
        }

        /* Cabecera */
        .mobile-header {
            position: relative;
            z-index: 25;
            display: flex;
            flex-direction: column;
            gap: 2px;
            text-align: center;
            padding: 4px 0;
        }

        .greeting-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: #7dd3fc;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }

        /* Área central: Imagen y Canvas de pétalos */
        .mobile-center-stage {
            position: relative;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            margin: 4px 0;
            overflow: hidden;
            cursor: pointer;
            touch-action: manipulation;
            outline: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent !important;
        }

        .mobile-center-stage:active,
        .mobile-center-stage:focus {
            background-color: transparent !important;
            outline: none !important;
        }

        .character-root {
            position: absolute;
            width: 115%;
            height: 115%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            pointer-events: none;
        }

        .character-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 15px rgba(56, 189, 248, 0.35));
            animation: float-character 6s ease-in-out infinite;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Canvas de pétalos flotando al frente */
        #sakura {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
        }

        /* Panel Inferior */
        .mobile-footer {
            position: relative;
            z-index: 25;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            padding: 10px 12px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

       .main-title {
            font-size: 1.05rem; /* Ajustado para que quepa en una sola línea */
            font-weight: 900;
            color: #ffffff;
            line-height: 1.1;
            letter-spacing: 1px; /* Espaciado más compacto */
            white-space: nowrap; /* Evita que salte de línea */
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
            font-family: 'Cinzel', serif;
        }

        

        .subtitle-tag {
            font-size: 0.52rem;
            color: #7dd3fc;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

       .play-btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border: none;
            color: #ffffff;
            padding: 6px 12px; /* Ligeramente más compacto a los lados */
            font-size: 0.62rem;
            font-weight: 900;
            cursor: pointer;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
            transition: transform 0.1s ease;
            white-space: nowrap;
            flex-shrink: 0; /* Evita que el botón se aplaste */
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .music-player {
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-top: 1px solid rgba(147, 197, 253, 0.2);
            padding-top: 5px;
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .track-title {
            font-size: 0.55rem;
            font-weight: 700;
            color: #e0f2fe;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 70%;
        }

        .time-display {
            font-size: 0.5rem;
            font-family: monospace;
            color: #7dd3fc;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            position: relative;
            border-radius: 2px;
            cursor: pointer;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #38bdf8;
            position: absolute;
            top: 0; left: 0;
            border-radius: 2px;
            box-shadow: 0 0 8px #38bdf8;
        }

        /* Efectos interactivos */
        .touch-ripple {
            position: absolute;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.95) 0%, rgba(56, 189, 248, 0) 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: ripple-effect 0.6s ease-out forwards;
            pointer-events: none;
            z-index: 50;
        }

        @keyframes ripple-effect {
            0% { width: 10px; height: 10px; opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            100% { width: 90px; height: 90px; opacity: 0; transform: translate(-50%, -50%) scale(1.4); }
        }

        /* Corazón ubicado debajo del mensaje */
        .floating-heart {
            position: absolute;
            font-size: 1.2rem;
            user-select: none;
            animation: float-heart-under 1.2s ease-out forwards;
            pointer-events: none;
            z-index: 60;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
            transform: translate(-50%, -50%);
        }

       @keyframes float-heart-under {
    0% { transform: translate(-50%, 0) scale(0.7); opacity: 1; }
    100% { transform: translate(-50%, 8px) scale(1.15); opacity: 0; }
}

        .touch-floating-msg {
            position: absolute;
            font-size: 0.72rem;
            font-weight: 700;
            color: #ffffff;
            background: rgba(3, 7, 18, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.6);
            padding: 5px 10px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
            pointer-events: none;
            z-index: 70;
            white-space: nowrap;
            animation: float-msg-up 1.4s ease-out forwards;
            transform: translate(-50%, 0);
        }

        @keyframes float-msg-up {
            0% { transform: translate(-50%, 0) scale(0.8); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translate(-50%, -50px) scale(1); opacity: 0; }
        }

        @keyframes float-character { 
            0%, 100% { transform: translateY(0px); } 
            50% { transform: translateY(-4px); } 
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- Cabecera limpia con saludo simple -->
        <header class="mobile-header">
            <span class="greeting-title">¡Buenos días! ☀️</span>
        </header>

        <!-- Centro: Área interactiva en la imagen -->
        <div class="mobile-center-stage" id="image-stage">
            <div class="character-root">
                <img src="frieren.png" alt="Frieren y Himmel" class="character-img" draggable="false">
            </div>
            <canvas id="sakura"></canvas>
        </div>

        <!-- Pie / Panel Inferior -->
        <footer class="mobile-footer">
            <div class="title-row">
                <div>
                    <span class="subtitle-tag">Un viaje para ti María</span>
                    <h1 class="main-title">Frieren & Himmel</h1>
                </div>
                <button class="play-btn" id="play-trigger">Reproducir</button>
            </div>

            <div class="music-player">
                <audio id="audio-element" src="frieren-ost.mp3" preload="auto"></audio>

                <div class="player-info">
                    <span class="track-title">En cualquier momento, en cualquier lugar</span>
                    <span class="time-display" id="time-track">0:00 / 0:00</span>
                </div>
                
                <div class="progress-container" id="progress-cont">
                    <div class="progress-bar" id="progress-actual"></div>
                </div>
            </div>
        </footer>

    </div>

    <script>
        const messages = [
            "Espero te vaya bien hoy!",
            "Estás hermosa como siempre!",
            "¡Diviértete!",
            "¡Sonríe!",
            "¡Eres capaz de lograr todo lo que te propongas!",
            "Que tengas un día maravilloso ✨",
            "¡Hoy va a ser un gran día para ti!",
            "Brillas con luz propia 💫",
            "¡Tú puedes con todo!",
            "Que nada borre tu sonrisa hoy 😊",
            "Eres una persona increíble 💙"
        ];

        const imageStage = document.getElementById('image-stage');
        let lastTriggerTime = 0;

        function handleStageTouch(clientX, clientY) {
            const now = Date.now();
            if (now - lastTriggerTime < 350) return;
            lastTriggerTime = now;

            const rect = imageStage.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            // 1. Onda precisa en el punto de contacto
            const ripple = document.createElement('div');
            ripple.className = 'touch-ripple';
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            imageStage.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);

            // 2. Mensaje motivador flotante (arriba del toque)
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            const msgBubble = document.createElement('div');
            msgBubble.className = 'touch-floating-msg';
            msgBubble.textContent = randomMsg;
            msgBubble.style.left = `${x}px`;
            msgBubble.style.top = `${y - 20}px`;
            imageStage.appendChild(msgBubble);
            setTimeout(() => msgBubble.remove(), 1400);

            // 3. Corazón flotante ubicado debajo del mensaje
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = '❤️';
            heart.style.left = `${x}px`;
         heart.style.top = `${y + 2}px`;
            imageStage.appendChild(heart);
            setTimeout(() => heart.remove(), 1200);
        }

        // Listener unificado sin duplicación de eventos
        imageStage.addEventListener('pointerdown', function(e) {
            handleStageTouch(e.clientX, e.clientY);
        });

        // Canvas 2D de pétalos de maná
        window.requestAnimFrame = (function () {
            return window.requestAnimationFrame ||
                window.webkitRequestAnimationFrame ||
                window.mozRequestAnimationFrame ||
                function (callback) { window.setTimeout(callback, 10 / 10); };
        })();

        function random(n) { return Math.floor(Math.random() * n) + 1; }

        function Canvas(elm) {
            this.elm = elm;
            this.canvasCtx = this.elm.getContext('2d');
            this.width = this.elm.width;
            this.height = this.elm.height;
            this.children = new Array();
            this.init();
        }

        Canvas.prototype = {
            resize: function () {
                const parent = this.elm.parentNode;
                this.width = this.elm.width = parent.clientWidth * 2;
                this.height = this.elm.height = parent.clientHeight * 2;
            },
            clear: function () { this.canvasCtx.clearRect(0, 0, this.width, this.height); },
            addChild: function (child) { this.children.push(child); },
            removeChild: function (num) { this.children.splice(num, 1); },
            rendering: function () {
                this.clear();
                for (var i = this.children.length - 1; i >= 0; i--) {
                    if (this.children[i].draw(this.canvasCtx)) { this.removeChild(i); }
                }
            },
            createSakura: function (num, x1, y1, x2, y2) {
                var colors = ["#38bdf8", "#7dd3fc", "#e0f2fe", "#bae6fd"];
                for (var i = 0; i < num; i++) {
                    var x_pos = Math.floor(Math.random() * (x2 - x1)) + x1;
                    var y_pos = Math.floor(Math.random() * (y2 - y1)) + y1;
                    this.addChild(new Sakura(this, x_pos, y_pos, Math.random() * 0.8 + 0.6,
                        { x: random(360), y: random(360), z: random(360) },
                        { x: random(8), y: random(8), z: random(8) },
                        random(4), colors[Math.floor(Math.random() * colors.length)]));
                }
            },
            animate: function () {
                var _this = this;
                if (Math.random() > 0.1 && this.children.length < 40) {
                    this.createSakura(3, 1, -20, this.width, -10);
                }
                this.rendering();
                window.requestAnimationFrame(function () { _this.animate(); });
            },
            init: function () { this.resize(); this.animate(); }
        };

        function Sakura(parent, x, y, scale, direction, rotate, wind, color) {
            this.parent = parent; this.x_pos = x; this.y_pos = y;
            this.scale = scale; this.direction = direction;
            this.rotate = rotate; this.wind = wind; this.gr = 3; this.color = color;
        }

        Sakura.prototype = {
            draw: function (ctx) {            
                ctx.save();
                ctx.beginPath();
                ctx.translate(this.x_pos, this.y_pos);
                ctx.rotate(this.direction.y / 100 * Math.PI);
                ctx.scale(this.scale, this.scale);
                ctx.fillStyle = this.color;

                var x_rad = Math.cos(this.direction.x * Math.PI / 100);
                var z_rad = Math.cos(this.direction.z * Math.PI / 100);
                ctx.moveTo(-6 * z_rad, -10 * x_rad);
                ctx.bezierCurveTo(-10 * z_rad, 0 * x_rad, -5 * z_rad, 10 * x_rad, 0 * z_rad, 10 * x_rad);
                ctx.bezierCurveTo(0 * z_rad, 0 * x_rad, 0 * z_rad, 0 * x_rad, -1 * z_rad, -1 * x_rad);
                ctx.fill();
                ctx.restore();
                return this.moveSakura();
            },
            moveSakura: function () {
                this.y_pos += (this.gr * this.scale);
                this.x_pos += (this.wind / 2);
                this.direction.x += this.rotate.x / 3;
                this.direction.y += this.rotate.y / 3;
                this.direction.z += this.rotate.z / 3;
                if (this.x_pos > this.parent.width + 50) return true;
                return this.y_pos > this.parent.height + 50;
            }
        };

        window.onload = () => {
            let canvasEle = document.getElementById("sakura");
            let sakuraCanvas = new Canvas(canvasEle);
            window.addEventListener('resize', () => { sakuraCanvas.resize(); });
        };

        // Reproductor de música
        const audio = document.getElementById('audio-element');
        const playBtn = document.getElementById('play-trigger');
        const progressContainer = document.getElementById('progress-cont');
        const progressBar = document.getElementById('progress-actual');
        const timeDisplay = document.getElementById('time-track');

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().then(() => playBtn.textContent = 'Pausar').catch(err => console.error(err));
            } else {
                audio.pause();
                playBtn.textContent = 'Reproducir';
            }
        });

        audio.addEventListener('timeupdate', () => {
            if(!audio.duration) return;
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = `${percent}%`;
            const mins = Math.floor(audio.currentTime / 60);
            const secs = Math.floor(audio.currentTime % 60);
            timeDisplay.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs} / ${Math.floor(audio.duration/60)}:${Math.floor(audio.duration%60) < 10 ? '0':''}${Math.floor(audio.duration%60)}`;
        });

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
        });
    </script>
</body>
</html>
